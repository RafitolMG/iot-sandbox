# frontend/nginx.conf — serves the built Vue SPA and reverse-proxies the API (CP-4).
#
# The browser only ever talks to this origin (port 5173): static assets are served locally
# and every `/api/...` call is proxied to the FastAPI service on the compose network. This
# keeps the SPA same-origin (no CORS) and mirrors the Vite dev-server proxy used in `npm run dev`.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match the API's max upload (settings.max_upload_bytes = 64 MiB) so large samples proxy through.
    client_max_body_size 64m;

    # gzip static assets for snappier loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy: /api/<path>  ->  http://api:8000/<path>
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Analyses can take a while; give the upstream generous timeouts.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # SPA history fallback: unknown paths (e.g. /samples/1) serve index.html so vue-router resolves.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
