# alembic.ini — configuración de migraciones (CP-1)
# La URL de conexión NO se fija aquí: alembic/env.py la toma de app.config.settings
# (que la lee de DATABASE_URL). Así hay una única fuente de verdad.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se inyecta en env.py desde settings.database_url

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
