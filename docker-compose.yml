# docker-compose.yml — IoT Malware Dynamic Analysis Sandbox
# ─────────────────────────────────────────────────────────────────────────
# CP-1: infraestructura FUNCIONAL (sin lógica de análisis todavía).
#   api (FastAPI /health) · worker (Celery ping) · db (PostgreSQL) ·
#   valkey (broker) · frontend (placeholder, se implementa en CP-4).
# Formato: Compose Spec (sin clave `version:` — obsoleta desde Compose v2, ADR-014).
# Broker: Valkey 8 (ADR-011, BSD) — protocolo redis:// (redis://valkey:6379/N).
# ─────────────────────────────────────────────────────────────────────────

name: iot-sandbox

services:
  # --- API REST (FastAPI) — CP-1 (/health), CP-3 (POST /samples) ----------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: iot-sandbox/api:dev
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sandbox:sandbox@db:5432/sandbox}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://valkey:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://valkey:6379/1}
    ports:
      - "8000:8000"          # http://localhost:8000/health
    volumes:
      - sample_storage:/data/samples      # binarios subidos (tratados como NO confiables)
    healthcheck:
      # sin curl en la imagen: se usa urllib de la propia stdlib de Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sandbox_net]
    restart: unless-stopped

  # --- Worker de análisis (Celery + emulación QEMU vía DooD) — CP-3 ---------
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: iot-sandbox/worker:dev
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://sandbox:sandbox@db:5432/sandbox}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://valkey:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://valkey:6379/1}
      EMULATION_TIMEOUT: ${EMULATION_TIMEOUT:-180}
      # Override opcional del wiring DooD; si va vacío, el worker lo autodescubre
      # inspeccionando sus propios montajes (ver worker/emulation.py, ADR-017).
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
    volumes:
      - sample_storage:/data/samples:ro   # lee la muestra (solo lectura)
      - artifacts:/data/artifacts         # strace.log, capture.pcap, fs_events.log
      # DooD (ADR-017): el worker lanza `iot-sandbox/emulation:dev` por el socket del host.
      # RIESGO: montar docker.sock ~= root en el host. Mitigacion: el worker solo corre una
      # imagen fija sin --privileged; la muestra NO confiable vive dentro de QEMU (2 capas
      # por debajo del socket) y nunca toca el worker ni el socket. Detalle en ADR-017.
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind del repo: da al worker la RUTA DEL HOST del proyecto (via self-inspect) para
      # montarla en el contenedor de emulación (scripts + kernel/rootfs de _build/images).
      - ./:/project:ro
    # NOTA: la emulación cross-ISA (ARM sobre host x86) usa TCG, NO KVM; el contenedor de
    # emulación corre SIN privilegios ni /dev/kvm (ver CP-2/ADR-016).
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -t 10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks: [sandbox_net]
    restart: unless-stopped

  # --- Base de datos (PostgreSQL) — ADR-010 -------------------------------
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox}
      POSTGRES_DB: ${POSTGRES_DB:-sandbox}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandbox} -d ${POSTGRES_DB:-sandbox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sandbox_net]
    restart: unless-stopped

  # --- Broker / cola (Valkey 8, BSD) — ADR-011 ----------------------------
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sandbox_net]
    restart: unless-stopped

  # --- Frontend (SPA Vue 3 + Vite, servida por nginx) — CP-4 ---------------
  # Build multi-stage (docker/frontend.Dockerfile): `vite build` -> bundle estatico servido
  # por nginx, que ademas reverse-proxya /api -> api:8000 (mismo origen, sin CORS).
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: iot-sandbox/frontend:dev
    depends_on:
      # Espera a que la API este healthy: asi nginx resuelve el nombre `api` al arrancar
      # (proxy_pass http://api:8000/ usa un hostname literal).
      api:
        condition: service_healthy
    ports:
      - "5173:5173"          # http://localhost:5173  (SPA + proxy /api)
    healthcheck:
      # busybox wget (incluido en nginx:alpine). Se usa 127.0.0.1 y NO localhost: dentro de
      # Alpine `localhost` resuelve primero a ::1 (IPv6) y nginx escucha `listen 5173` solo en
      # IPv4 -> connection refused. El acceso del host (puerto mapeado) va por IPv4 y funciona.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [sandbox_net]
    restart: unless-stopped

volumes:
  pgdata:          # datos persistentes de PostgreSQL
  sample_storage:  # binarios de muestra subidos por la API, leídos por el worker
  artifacts:       # artefactos forenses producidos por el worker (pcap, logs)

networks:
  sandbox_net:
    driver: bridge
