# dnsmasq.conf — Resolutor comodín de la sandbox (CP-5, ADR-022).
#
# Sustituye al servicio DNS de INetSim, que no funciona con las versiones actuales de
# Net::DNS (ver ADR-022): INetSim 1.3.2 llama a Net::DNS::Nameserver->main_loop, retirado
# en Net::DNS >= 1.01, y la API que lo reemplaza aborta si se la invoca desde un
# subproceso, que es justo como INetSim arranca cada servicio.
#
# Comportamiento: CUALQUIER dominio resuelve a 192.0.2.1. Así la muestra siempre obtiene
# respuesta —nunca un NXDOMAIN que delate la sandbox— y su conexión posterior acaba en
# INetSim por el DNAT del contenedor de emulación.

port=53
listen-address=0.0.0.0
bind-interfaces

# Comodín: todo resuelve a la IP sintética (TEST-NET-1, RFC 5737).
address=/#/192.0.2.1

# Nada de reenviar a resolutores reales ni de leer /etc/hosts: este DNS se inventa
# TODAS las respuestas, no consulta a nadie.
no-resolv
no-hosts
no-poll

# Las consultas al log del contenedor: queda constancia de qué dominios pidió la muestra
# (el IoC bueno se extrae del pcap del invitado, esto es apoyo para depurar).
log-queries
log-facility=-
