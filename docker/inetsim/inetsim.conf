# inetsim.conf — Simulación de servicios de Internet para la sandbox (CP-5, ADR-022).
#
# INetSim responde de forma sintética a lo que la muestra intente hacer en la red, de modo
# que el binario "crea" tener conectividad y siga ejecutándose en lugar de abortar (evasión
# por comprobación de conectividad, §2.2.4 de la memoria).
#
# El contenedor vive en una red Docker `internal: true`: nada de esto sale a Internet.

#########################################
# Servicios que se arrancan.
#
# DNS + HTTP/HTTPS son los que de verdad importan para el malware IoT (resolución del C2 y
# descarga de la segunda etapa). El resto cubre puertos que las familias tipo Mirai/Gafgyt
# tocan al propagarse. dummy_tcp/udp es el catch-all: acepta la conexión y contesta algo,
# que es lo único necesario para que el binario dé la red por buena.
# OJO: el servicio `dns` de INetSim NO se arranca aquí. INetSim 1.3.2 llama a
# Net::DNS::Nameserver->main_loop, método retirado en Net::DNS >= 1.01 (Debian trixie trae
# 1.56), y el servicio muere al nacer. El DNS comodín lo sirve dnsmasq en este mismo
# stack (servicio `simdns`, docker/simdns/dnsmasq.conf). Detalle en ADR-022.
start_service http
start_service https
start_service ftp
start_service smtp
start_service pop3
start_service irc
start_service ntp
start_service tftp
start_service syslog
start_service time_tcp
start_service time_udp
start_service dummy_tcp
start_service dummy_udp

#########################################
# Escucha en todas las interfaces del contenedor: el tráfico llega redirigido por DNAT
# desde el contenedor de emulación, no desde localhost.
service_bind_address 0.0.0.0
service_run_as_user inetsim

# Una detonación es un único invitado; con 20 hijos por servicio sobra y evita que una
# muestra que abra conexiones en bucle agote el contenedor.
service_max_childs 20

#########################################
# Respuesta DNS por defecto.
#
# 192.0.2.1 es TEST-NET-1 (RFC 5737, reservada para documentación): no es enrutable, así que
# si algún día fallara el DNAT el tráfico no llegaría a ninguna parte real. La IP no se
# reporta como IoC (worker/parsers.py la trata como infraestructura); el IoC bueno es el
# DOMINIO consultado, que sí queda en el pcap del invitado.
dns_default_ip 192.0.2.1

# Puerto del catch-all. El invitado nunca lo ve: el DNAT reescribe el destino y el pcap
# se captura dentro de QEMU, con la IP y el puerto originales que pidió la muestra.
dummy_bind_port 1
